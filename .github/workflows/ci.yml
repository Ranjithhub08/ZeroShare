name: ZeroShare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend - Node.js Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm install
      - name: Syntax check
        run: cd backend && node --check server.js

  frontend-build:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm install
      - name: Lint
        run: cd frontend && npm run lint
      - name: Build
        run: cd frontend && npm run build
      - name: Run frontend tests
        run: cd frontend && npm test

  ml-service-check:
    name: ML Service - Python Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ml-service deps
        run: cd ml-service && pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile ml-service/main.py

  docker-build:
    name: Docker - Build All Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-check, frontend-build, ml-service-check]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t zeroshare-backend ./backend
      - name: Build frontend image
        run: docker build -t zeroshare-frontend ./frontend
      - name: Build ml-service image
        run: docker build -t zeroshare-ml ./ml-service
